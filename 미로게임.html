<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미로게임</title>
<style>
:root{--bg:#0d0a08;--panel:#1a130f;--stone:#9a7650;--torch:#ffb347;--text:#efe2cf;--danger:#e0533c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
font-family:"Noto Serif KR","Batang","Malgun Gothic",serif;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
#hud{display:flex;gap:18px;font-size:17px;font-weight:700;color:var(--torch)}
#hud span b{color:var(--text)}
#hud .low{color:var(--danger)}
canvas{border:3px solid #3a2a1c;border-radius:6px;background:#120d0a;box-shadow:0 0 30px #000}
#pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:6px}
#pad button{background:var(--panel);color:var(--torch);border:2px solid #3a2a1c;border-radius:10px;font-size:22px}
#pad button:active{background:#33241a}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
.screen{position:fixed;inset:0;background:rgba(8,5,3,.72);display:none;align-items:center;justify-content:center;z-index:5}
.screen.on{display:flex}
.box{background:var(--panel);border:3px solid #4a3523;border-radius:12px;padding:26px 30px;text-align:center;max-width:88vw;box-shadow:0 0 40px #000}
.box h1{margin:0 0 6px;font-size:38px;color:var(--torch);letter-spacing:4px}
.box h2{margin:0 0 10px;font-size:30px;color:var(--danger)}
.box p{margin:6px 0;line-height:1.6;font-size:16px}
.box .big{font-size:22px;color:var(--torch);font-weight:700}
.btn{margin-top:14px;background:var(--torch);color:#2a1606;border:0;border-radius:10px;font:700 20px inherit;font-family:inherit;padding:12px 30px}
.btn:active{filter:brightness(.85)}
.btn:focus-visible,#pad button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span>층 <b id="lv">1</b></span>
    <span>남은 시간 <b id="tm">45</b>초</span>
    <span>점수 <b id="sc">0</b></span>
  </div>
  <canvas id="cv"></canvas>
  <div id="pad">
    <button class="u" data-d="0" aria-label="위">▲</button>
    <button class="l" data-d="3" aria-label="왼쪽">◀</button>
    <button class="d" data-d="2" aria-label="아래">▼</button>
    <button class="r" data-d="1" aria-label="오른쪽">▶</button>
  </div>
</div>

<div class="screen on" id="start"><div class="box">
  <h1>미로게임</h1>
  <p>🧙 어두운 던전의 미로를 탈출하라!</p>
  <p>제한 시간 안에 🚪 출구에 도착하면 성공.<br>시간이 끝나거나 숨겨진 💀 함정을 밟으면 실패.<br>클리어할 때마다 미로가 커진다.</p>
  <p style="font-size:14px;opacity:.8">조작: 방향키·WASD, 화면 버튼, 미로 터치(클릭)</p>
  <button class="btn" id="go">게임 시작</button>
</div></div>

<div class="screen" id="over"><div class="box">
  <h2 id="ot">게임 오버</h2>
  <p id="why"></p>
  <p>도달한 층: <span class="big" id="ol">1</span></p>
  <p>최종 점수: <span class="big" id="os">0</span></p>
  <button class="btn" id="again">다시 하기</button>
</div></div>

<script>
const TIME_LIMIT=45;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const D=[{dx:0,dy:-1,b:1,o:4},{dx:1,dy:0,b:2,o:8},{dx:0,dy:1,b:4,o:1},{dx:-1,dy:0,b:8,o:2}];
let n,cell,walls,px,py,traps,level,score,state='start',startT,flash=0,flashText='';

function build(){
  n=5+level; // 1층: 6x6, 클리어할 때마다 1칸씩 커짐
  walls=new Array(n*n).fill(15);
  const seen=new Array(n*n).fill(false),st=[0];seen[0]=true;
  while(st.length){
    const c=st[st.length-1],x=c%n,y=(c/n)|0,opts=[];
    D.forEach((d,i)=>{const nx=x+d.dx,ny=y+d.dy;if(nx>=0&&ny>=0&&nx<n&&ny<n&&!seen[ny*n+nx])opts.push(i)});
    if(!opts.length){st.pop();continue}
    const i=opts[(Math.random()*opts.length)|0],d=D[i],nc=(y+d.dy)*n+x+d.dx;
    walls[c]&=~d.b;walls[nc]&=~d.o;seen[nc]=true;st.push(nc);
  }
  // 정답 경로 계산 (함정은 정답 경로 밖에서만 생성 -> 항상 클리어 가능)
  const prev=new Array(n*n).fill(-1),q=[0];prev[0]=0;
  while(q.length){const c=q.shift(),x=c%n,y=(c/n)|0;
    D.forEach(d=>{if(walls[c]&d.b)return;const nc=(y+d.dy)*n+x+d.dx;if(prev[nc]<0){prev[nc]=c;q.push(nc)}})}
  const path=new Set();let c=n*n-1;while(c!==0){path.add(c);c=prev[c]}path.add(0);
  const free=[];for(let i=0;i<n*n;i++)if(!path.has(i))free.push(i);
  for(let i=free.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[free[i],free[j]]=[free[j],free[i]]}
  traps=new Set(free.slice(0,Math.max(1,Math.floor(n*n*0.06))));
  px=0;py=0;startT=performance.now();resize();
}

function resize(){
  const s=Math.max(200,Math.min(window.innerWidth-24,window.innerHeight-230,600));
  const dpr=window.devicePixelRatio||1;
  cv.style.width=cv.style.height=s+'px';cv.width=cv.height=s*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);cell=s/n;cv.dataset.s=s;
}
window.addEventListener('resize',()=>{if(n)resize()});

function timeLeft(){return Math.max(0,TIME_LIMIT-(performance.now()-startT)/1000)}

function move(i){
  if(state!=='play')return;
  const c=py*n+px,d=D[i];
  if(walls[c]&d.b)return;
  px+=d.dx;py+=d.dy;
  const id=py*n+px;
  if(traps.has(id)){end('함정에 빠졌다! 💀');return}
  if(px===n-1&&py===n-1){
    const left=Math.floor(timeLeft());
    score+=100+left;level++;
    flashText='탈출 성공! +'+(100+left);flash=performance.now();
    build();updateHud();
  }
}

function end(reason){
  state='over';
  $('why').textContent=reason;$('ol').textContent=level;$('os').textContent=score;
  $('over').classList.add('on');
}
function updateHud(){$('lv').textContent=level;$('sc').textContent=score}
function startGame(){
  level=1;score=0;state='play';
  $('start').classList.remove('on');$('over').classList.remove('on');
  build();updateHud();
}
$('go').onclick=startGame;$('again').onclick=startGame;

function draw(now){
  requestAnimationFrame(draw);
  if(!n)return;
  const s=parseFloat(cv.dataset.s);
  ctx.clearRect(0,0,s,s);
  // 바닥
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    ctx.fillStyle=(x+y)%2?'#1c1510':'#211812';ctx.fillRect(x*cell,y*cell,cell,cell);
  }
  ctx.fillStyle='rgba(120,200,140,.10)';ctx.fillRect(0,0,cell,cell);
  ctx.fillStyle='rgba(255,200,90,.14)';ctx.fillRect((n-1)*cell,(n-1)*cell,cell,cell);
  // 벽
  ctx.strokeStyle='#8c6a47';ctx.lineWidth=Math.max(2,cell*0.14);ctx.lineCap='round';
  ctx.beginPath();
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const w=walls[y*n+x],X=x*cell,Y=y*cell;
    if(w&1){ctx.moveTo(X,Y);ctx.lineTo(X+cell,Y)}
    if(w&2){ctx.moveTo(X+cell,Y);ctx.lineTo(X+cell,Y+cell)}
    if(w&4){ctx.moveTo(X,Y+cell);ctx.lineTo(X+cell,Y+cell)}
    if(w&8){ctx.moveTo(X,Y);ctx.lineTo(X,Y+cell)}
  }
  ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=(cell*0.62)+'px serif';
  // 함정은 게임오버 때만 보임
  if(state==='over')traps.forEach(i=>ctx.fillText('💀',(i%n+.5)*cell,((i/n|0)+.5)*cell));
  ctx.fillText('🚪',(n-.5)*cell,(n-.5)*cell);
  ctx.fillText('🧙',(px+.5)*cell,(py+.5)*cell);
  // 횃불 조명 (어두컴컴한 던전)
  if(state!=='over'){
    const fl=1+Math.sin(now/130)*0.04+Math.sin(now/53)*0.02;
    const r=Math.max(cell*3.6,s*0.28)*fl,cx=(px+.5)*cell,cy=(py+.5)*cell;
    const g=ctx.createRadialGradient(cx,cy,cell*0.5,cx,cy,r);
    g.addColorStop(0,'rgba(10,6,3,0)');g.addColorStop(1,'rgba(6,3,2,.82)');
    ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
  }
  // 시간 처리
  if(state==='play'){
    const t=timeLeft();
    const el=$('tm');el.textContent=Math.ceil(t);el.className=t<=10?'low':'';
    if(t<=0)end('시간이 모두 지났다! ⏳');
  }
  // 성공 문구
  if(flash&&now-flash<1000){
    ctx.globalAlpha=1-(now-flash)/1000;ctx.fillStyle='#ffd27a';
    ctx.font='bold '+(s*0.07)+'px sans-serif';ctx.fillText(flashText,s/2,s*0.12);ctx.globalAlpha=1;
  }
}
requestAnimationFrame(draw);

// 키보드
const keys={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3};
window.addEventListener('keydown',e=>{if(e.key in keys){e.preventDefault();move(keys[e.key])}});

// 화면 버튼 (누르고 있으면 반복 이동)
document.querySelectorAll('#pad button').forEach(b=>{
  let tm;const i=+b.dataset.d;
  const stop=()=>{clearInterval(tm)};
  b.addEventListener('pointerdown',e=>{e.preventDefault();move(i);stop();tm=setInterval(()=>move(i),140)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
});

// 미로 터치/클릭: 캐릭터 기준으로 누른 방향으로 이동
let ct;
function canvasDir(e){
  const r=cv.getBoundingClientRect(),s=r.width/n;
  const dx=(e.clientX-r.left)-(px+.5)*s,dy=(e.clientY-r.top)-(py+.5)*s;
  return Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();let last=e;move(canvasDir(e));
  clearInterval(ct);ct=setInterval(()=>move(canvasDir(last)),150);
  cv.onpointermove=ev=>{last=ev};
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{clearInterval(ct);cv.onpointermove=null}));
</script>
</body>
</html>
